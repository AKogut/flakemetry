name: Bug report
description: Something is broken
labels: ['type:bug']
body:
  - type: dropdown
    id: area
    attributes:
      label: Where
      options:
        - Reporter (Playwright, Vitest, Jest or pytest)
        - CLI or GitHub Action
        - Dashboard
        - API or worker
        - Self-hosting (compose, Helm, backups)
        - Documentation
        - Not sure
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Minimal steps, config or repository to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versions
      description: Flakemetry package versions or commit sha, and the test runner version if a reporter is involved
      placeholder: '@flakemetry/playwright-reporter 0.1.4, @playwright/test 1.63.0'
  - type: textarea
    id: context
    attributes:
      label: Environment
      description: OS, Node version, CI provider, and how the instance is deployed
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Output of `flakemetry doctor`, reporter output, or service logs. Remove tokens first.
      render: text
