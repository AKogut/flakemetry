version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One pull request per class of change keeps the queue readable; security
      # fixes still arrive on their own as soon as an advisory lands.
      # OpenTelemetry comes first: its packages move together, majors included,
      # and an update lands in the first group that matches it.
      opentelemetry:
        patterns: ['@opentelemetry/*']
      production:
        dependency-type: production
        update-types: [minor, patch]
      development:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]

  - package-ecosystem: pip
    directory: /packages/pytest-flakemetry
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
