name: helm

on:
  push:
    branches: [main]
    paths:
      - 'deploy/helm/**'
      - 'Dockerfile'
      - 'packages/db/prisma/**'
      - '.github/workflows/helm.yml'
  pull_request:
    paths:
      - 'deploy/helm/**'
      - 'Dockerfile'
      - 'packages/db/prisma/**'
      - '.github/workflows/helm.yml'

jobs:
  chart:
    name: lint + template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: azure/setup-helm@v5
        with:
          version: v3.16.3

      - name: helm lint
        run: |
          helm lint deploy/helm/flakemetry \
            --set database.url='postgresql://u:p@db:5432/flakemetry?schema=public' \
            --set auth.secret='ci-placeholder-secret-value-0001'

      - name: helm template (renders all resources)
        run: |
          helm template ci deploy/helm/flakemetry \
            --set database.url='postgresql://u:p@db:5432/flakemetry?schema=public' \
            --set auth.secret='ci-placeholder-secret-value-0001' \
            --set ai.enabled=true \
            --set ingress.enabled=true \
            --set selfTelemetry.otlpEndpoint=http://otel-collector.observability:4318 \
            > /tmp/rendered.yaml
          test "$(grep -c '^kind:' /tmp/rendered.yaml)" -ge 10
          test "$(grep -c 'name: FLAKEMETRY_SELF_OTEL_ENDPOINT' /tmp/rendered.yaml)" -eq 2

      - name: A database CA bundle reaches every component that connects
        run: |
          helm template ci deploy/helm/flakemetry \
            --set database.url='postgresql://u:p@db:5432/flakemetry?schema=public&sslmode=verify-full' \
            --set auth.secret='ci-placeholder-secret-value-0001' \
            --set database.caBundle='-----BEGIN CERTIFICATE-----' \
            > /tmp/with-ca.yaml
          test "$(grep -c 'name: NODE_EXTRA_CA_CERTS' /tmp/with-ca.yaml)" -eq 3
          test "$(grep -c 'kind: ConfigMap' /tmp/with-ca.yaml)" -eq 1
          helm template ci deploy/helm/flakemetry \
            --set database.url='postgresql://u:p@db:5432/flakemetry?schema=public' \
            --set auth.secret='ci-placeholder-secret-value-0001' \
            > /tmp/without-ca.yaml
          test "$(grep -c 'NODE_EXTRA_CA_CERTS' /tmp/without-ca.yaml)" -eq 0

  install:
    name: installs and upgrades on a real cluster
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: azure/setup-helm@v5
        with:
          version: v3.16.3

      - uses: helm/kind-action@v1.15.0
        with:
          cluster_name: flakemetry

      - name: Build the images and load them into the cluster
        run: |
          for target in api worker web migrate; do
            docker build --target "$target" -t "flakemetry-$target:ci" .
            kind load docker-image "flakemetry-$target:ci" --name flakemetry
          done

      - name: Start Postgres in the cluster
        run: |
          kubectl create namespace flakemetry
          kubectl -n flakemetry apply -f - <<'YAML'
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: postgres
          spec:
            selector:
              matchLabels: { app: postgres }
            template:
              metadata:
                labels: { app: postgres }
              spec:
                containers:
                  - name: postgres
                    image: postgres:16-alpine
                    env:
                      - { name: POSTGRES_USER, value: flakemetry }
                      - { name: POSTGRES_PASSWORD, value: flakemetry }
                      - { name: POSTGRES_DB, value: flakemetry }
                    ports: [{ containerPort: 5432 }]
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: postgres
          spec:
            selector: { app: postgres }
            ports: [{ port: 5432 }]
          YAML
          kubectl -n flakemetry rollout status deploy/postgres --timeout=180s

      - name: A first install migrates the database and starts every component
        run: |
          helm install fm deploy/helm/flakemetry -n flakemetry --wait --timeout 5m \
            --set image.registry=docker.io --set image.repository=library \
            --set image.tag=ci --set image.pullPolicy=Never \
            --set database.url='postgresql://flakemetry:flakemetry@postgres:5432/flakemetry?schema=public' \
            --set auth.secret='ci-placeholder-secret-value-0001' \
            --set auth.url=http://localhost:3000
          applied=$(kubectl -n flakemetry exec deploy/postgres -- psql -U flakemetry -tAc \
            'select count(*) from _prisma_migrations where finished_at is not null')
          shipped=$(find packages/db/prisma/migrations -mindepth 1 -maxdepth 1 -type d | wc -l)
          echo "applied $applied of $shipped migrations"
          test "$applied" -eq "$shipped"

      - name: An upgrade runs the migration hook again and rolls
        run: |
          helm upgrade fm deploy/helm/flakemetry -n flakemetry --reuse-values --wait --timeout 5m \
            --set-string podAnnotations.rolled="$(date +%s)"
          test "$(kubectl -n flakemetry get secret -o name | grep -c migrate)" -eq 0

      - name: The api and the dashboard answer through their Services
        run: |
          kubectl -n flakemetry port-forward svc/fm-flakemetry-api 4000:80 > /dev/null 2>&1 &
          kubectl -n flakemetry port-forward svc/fm-flakemetry-web 3000:80 > /dev/null 2>&1 &
          for port in 4000 3000; do
            for _ in $(seq 1 30); do
              if curl -sf "http://localhost:$port/health"; then echo; break; fi
              sleep 2
            done
            curl -sf "http://localhost:$port/health" > /dev/null
          done

      - name: A database that requires a verified certificate, trusted through caBundle
        run: |
          workdir=$(mktemp -d)
          cd "$workdir"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=Flakemetry CI CA" -keyout ca.key -out ca.pem
          openssl req -newkey rsa:2048 -nodes -subj "/CN=postgres-tls" -keyout server.key -out server.csr
          printf 'subjectAltName=DNS:postgres-tls,DNS:postgres-tls.flakemetry-tls.svc\n' > san.cnf
          openssl x509 -req -in server.csr -CA ca.pem -CAkey ca.key -CAcreateserial -days 1 -extfile san.cnf -out server.crt
          kubectl create namespace flakemetry-tls
          kubectl -n flakemetry-tls create secret generic pg-tls --from-file=server.crt --from-file=server.key
          kubectl -n flakemetry-tls apply -f - <<'YAML'
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: postgres-tls
          spec:
            selector:
              matchLabels: { app: postgres-tls }
            template:
              metadata:
                labels: { app: postgres-tls }
              spec:
                securityContext: { fsGroup: 70 }
                containers:
                  - name: postgres
                    image: postgres:16-alpine
                    args: ['-c', 'ssl=on', '-c', 'ssl_cert_file=/tls/server.crt', '-c', 'ssl_key_file=/tls/server.key']
                    env:
                      - { name: POSTGRES_USER, value: flakemetry }
                      - { name: POSTGRES_PASSWORD, value: flakemetry }
                      - { name: POSTGRES_DB, value: flakemetry }
                    ports: [{ containerPort: 5432 }]
                    volumeMounts: [{ name: tls, mountPath: /tls, readOnly: true }]
                volumes:
                  - name: tls
                    secret: { secretName: pg-tls, defaultMode: 0640 }
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: postgres-tls
          spec:
            selector: { app: postgres-tls }
            ports: [{ port: 5432 }]
          YAML
          kubectl -n flakemetry-tls rollout status deploy/postgres-tls --timeout=180s
          cd "$GITHUB_WORKSPACE"
          helm install fmtls deploy/helm/flakemetry -n flakemetry-tls --wait --timeout 5m \
            --set image.registry=docker.io --set image.repository=library \
            --set image.tag=ci --set image.pullPolicy=Never \
            --set-string database.url='postgresql://flakemetry:flakemetry@postgres-tls:5432/flakemetry?schema=public&sslmode=verify-full' \
            --set-file database.caBundle="$workdir/ca.pem" \
            --set auth.secret='ci-placeholder-secret-value-0001' \
            --set auth.url=http://localhost:3000
          sleep 15
          encrypted=$(kubectl -n flakemetry-tls exec deploy/postgres-tls -- psql -U flakemetry -tAc \
            "select count(*) from pg_stat_ssl s join pg_stat_activity a using (pid) where s.ssl and a.usename = 'flakemetry' and a.pid <> pg_backend_pid()")
          echo "encrypted connections from the release: $encrypted"
          test "$encrypted" -gt 0
          if kubectl -n flakemetry-tls logs -l app.kubernetes.io/instance=fmtls --all-containers --tail=200 | grep -i 'certificate'; then
            echo 'a component failed to verify the database certificate'
            exit 1
          fi

      - name: Cluster state
        if: failure()
        run: |
          for namespace in flakemetry flakemetry-tls; do
            kubectl -n "$namespace" get all,jobs,secrets || true
            kubectl -n "$namespace" get events --sort-by=.lastTimestamp | tail -40 || true
            kubectl -n "$namespace" logs -l app.kubernetes.io/part-of!=nothing --all-containers --tail=80 || true
          done
