name: docs

on:
  push:
    branches: [main]
    paths:
      - 'apps/docs/**'
      - 'docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Fetch the release snapshots
        id: snapshots
        run: |
          labels=''
          if git fetch --quiet --depth 1 origin docs-snapshots 2> /dev/null; then
            git worktree add --quiet --detach "$RUNNER_TEMP/snapshots" FETCH_HEAD
            labels=$(find "$RUNNER_TEMP/snapshots/v" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -r | tr '\n' ' ')
          fi
          echo "labels=$labels" >> "$GITHUB_OUTPUT"

      - run: pnpm turbo run build --filter @flakemetry/docs
        env:
          DOCS_SNAPSHOTS: ${{ steps.snapshots.outputs.labels }}

      - name: Add the release snapshots
        if: steps.snapshots.outputs.labels != ''
        run: cp -R "$RUNNER_TEMP/snapshots/v" apps/docs/.vitepress/dist/v

      - uses: actions/configure-pages@v6
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/docs/.vitepress/dist

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
