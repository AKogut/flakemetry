packages:
  - 'apps/*'
  - 'packages/*'
  # Named rather than globbed: this one has to resolve the reporters through
  # workspace:* so the smoke run exercises the code in the pull request. The
  # playwright-demo alongside it deliberately installs them from npm, which is
  # what a reader copying it would get, and must keep doing so.
  - 'examples/reporter-smoke'
