# Published ports bind to loopback by default. Docker publishes straight past the host
# firewall, so `${POSTGRES_PORT}:5432` on a machine with a public address puts Postgres —
# with the development password below — on the internet. Set BIND_ADDRESS=0.0.0.0 only if
# you mean it; for a real deployment use deploy/compose, which publishes nothing but Caddy.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flakemetry}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flakemetry}
      POSTGRES_DB: ${POSTGRES_DB:-flakemetry}
    ports:
      - '${BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-flakemetry} -d ${POSTGRES_DB:-flakemetry}']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-flakemetry}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-flakemetry123}
    ports:
      - '${BIND_ADDRESS:-127.0.0.1}:${MINIO_PORT:-9000}:9000'
      - '${BIND_ADDRESS:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 3s
      retries: 10

  createbuckets:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-flakemetry} $${MINIO_ROOT_PASSWORD:-flakemetry123} &&
      mc mb --ignore-existing local/$${S3_BUCKET:-flakemetry-artifacts}
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-flakemetry}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-flakemetry123}
      S3_BUCKET: ${S3_BUCKET:-flakemetry-artifacts}

  migrate:
    build:
      context: .
      target: migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-flakemetry}:${POSTGRES_PASSWORD:-flakemetry}@postgres:5432/${POSTGRES_DB:-flakemetry}?schema=public
    restart: 'no'

  api:
    restart: unless-stopped
    build:
      context: .
      target: api
    depends_on:
      migrate:
        condition: service_completed_successfully
      createbuckets:
        condition: service_completed_successfully
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-flakemetry}:${POSTGRES_PASSWORD:-flakemetry}@postgres:5432/${POSTGRES_DB:-flakemetry}?schema=public
      FLAKEMETRY_PLUGINS: ${FLAKEMETRY_PLUGINS:-}
      FLAKEMETRY_PLUGIN_TIMEOUT_MS: ${FLAKEMETRY_PLUGIN_TIMEOUT_MS:-}
      FLAKEMETRY_SELF_OTEL_ENDPOINT: ${FLAKEMETRY_SELF_OTEL_ENDPOINT:-}
      OTEL_METRIC_EXPORT_INTERVAL: ${OTEL_METRIC_EXPORT_INTERVAL:-}
      FLAKEMETRY_S3_BUCKET: ${S3_BUCKET:-flakemetry-artifacts}
      FLAKEMETRY_S3_ENDPOINT: ${FLAKEMETRY_S3_ENDPOINT:-http://minio:9000}
      FLAKEMETRY_S3_REGION: ${FLAKEMETRY_S3_REGION:-us-east-1}
      FLAKEMETRY_S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-flakemetry}
      FLAKEMETRY_S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-flakemetry123}
      FLAKEMETRY_S3_FORCE_PATH_STYLE: 'true'
    ports:
      - '${BIND_ADDRESS:-127.0.0.1}:${API_PORT:-4000}:4000'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:4000/health']
      interval: 10s
      timeout: 3s
      retries: 6

  worker:
    restart: unless-stopped
    build:
      context: .
      target: worker
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-flakemetry}:${POSTGRES_PASSWORD:-flakemetry}@postgres:5432/${POSTGRES_DB:-flakemetry}?schema=public
      POLL_INTERVAL_MS: ${POLL_INTERVAL_MS:-1000}
      FLAKEMETRY_PLUGINS: ${FLAKEMETRY_PLUGINS:-}
      FLAKEMETRY_PLUGIN_TIMEOUT_MS: ${FLAKEMETRY_PLUGIN_TIMEOUT_MS:-}
      FLAKEMETRY_SELF_OTEL_ENDPOINT: ${FLAKEMETRY_SELF_OTEL_ENDPOINT:-}
      OTEL_METRIC_EXPORT_INTERVAL: ${OTEL_METRIC_EXPORT_INTERVAL:-}
      FLAKEMETRY_FLAKY_THRESHOLD: ${FLAKEMETRY_FLAKY_THRESHOLD:-}
      FLAKEMETRY_FLAKY_MIN_SAMPLES: ${FLAKEMETRY_FLAKY_MIN_SAMPLES:-}
      FLAKEMETRY_QUARANTINE_ENABLED: ${FLAKEMETRY_QUARANTINE_ENABLED:-}
      FLAKEMETRY_QUARANTINE_COOLDOWN_RUNS: ${FLAKEMETRY_QUARANTINE_COOLDOWN_RUNS:-}
      FLAKEMETRY_AI_RCA: ${FLAKEMETRY_AI_RCA:-}
      FLAKEMETRY_CI_MINUTE_COST: ${FLAKEMETRY_CI_MINUTE_COST:-}
      FLAKEMETRY_DEVELOPER_HOUR_COST: ${FLAKEMETRY_DEVELOPER_HOUR_COST:-}
      FLAKEMETRY_INVESTIGATION_MINUTES: ${FLAKEMETRY_INVESTIGATION_MINUTES:-}
      FLAKEMETRY_TRACKER_TOKEN: ${FLAKEMETRY_TRACKER_TOKEN:-}
      FLAKEMETRY_TRACKER_ENABLED: ${FLAKEMETRY_TRACKER_ENABLED:-}
      FLAKEMETRY_TRACKER_AFTER_DAYS: ${FLAKEMETRY_TRACKER_AFTER_DAYS:-}
      FLAKEMETRY_TRACKER_RECOVERY_DAYS: ${FLAKEMETRY_TRACKER_RECOVERY_DAYS:-}
      FLAKEMETRY_STORAGE_MAX_EXECUTIONS: ${FLAKEMETRY_STORAGE_MAX_EXECUTIONS:-}
      FLAKEMETRY_STORAGE_MAX_ARTIFACT_MB: ${FLAKEMETRY_STORAGE_MAX_ARTIFACT_MB:-}
      FLAKEMETRY_PUBLIC_API_URL: ${FLAKEMETRY_PUBLIC_API_URL:-http://localhost:4000}
      FLAKEMETRY_AI_PROVIDER: ${FLAKEMETRY_AI_PROVIDER:-}
      FLAKEMETRY_AI_MODEL: ${FLAKEMETRY_AI_MODEL:-}
      FLAKEMETRY_AI_API_KEY: ${FLAKEMETRY_AI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      FLAKEMETRY_AI_ENDPOINT: ${FLAKEMETRY_AI_ENDPOINT:-}
      FLAKEMETRY_AI_DAILY_TOKEN_BUDGET: ${FLAKEMETRY_AI_DAILY_TOKEN_BUDGET:-}
      FLAKEMETRY_S3_BUCKET: ${S3_BUCKET:-flakemetry-artifacts}
      FLAKEMETRY_S3_ENDPOINT: ${FLAKEMETRY_S3_ENDPOINT:-http://minio:9000}
      FLAKEMETRY_S3_REGION: ${FLAKEMETRY_S3_REGION:-us-east-1}
      FLAKEMETRY_S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-flakemetry}
      FLAKEMETRY_S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-flakemetry123}
      FLAKEMETRY_S3_FORCE_PATH_STYLE: 'true'
      FLAKEMETRY_ARTIFACT_RETENTION_DAYS: ${FLAKEMETRY_ARTIFACT_RETENTION_DAYS:-}
      FLAKEMETRY_EXECUTION_RETENTION_DAYS: ${FLAKEMETRY_EXECUTION_RETENTION_DAYS:-}
      FLAKEMETRY_QUEUE_VISIBILITY_MS: ${FLAKEMETRY_QUEUE_VISIBILITY_MS:-}
      FLAKEMETRY_AI_TIMEOUT_MS: ${FLAKEMETRY_AI_TIMEOUT_MS:-}

  web:
    restart: unless-stopped
    build:
      context: .
      target: web
    depends_on:
      migrate:
        condition: service_completed_successfully
      createbuckets:
        condition: service_completed_successfully
    environment:
      PORT: 3000
      HOSTNAME: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-flakemetry}:${POSTGRES_PASSWORD:-flakemetry}@postgres:5432/${POSTGRES_DB:-flakemetry}?schema=public
      AUTH_SECRET: '${AUTH_SECRET:?set AUTH_SECRET in .env, generate one with openssl rand -base64 32}'
      AUTH_GITHUB_ID: ${AUTH_GITHUB_ID:-}
      AUTH_GITHUB_SECRET: ${AUTH_GITHUB_SECRET:-}
      AUTH_OIDC_ISSUER: ${AUTH_OIDC_ISSUER:-}
      AUTH_OIDC_ID: ${AUTH_OIDC_ID:-}
      AUTH_OIDC_SECRET: ${AUTH_OIDC_SECRET:-}
      AUTH_OIDC_NAME: ${AUTH_OIDC_NAME:-}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      AUTH_TRUST_HOST: 'true'
      FLAKEMETRY_FLAKY_THRESHOLD: ${FLAKEMETRY_FLAKY_THRESHOLD:-}
      FLAKEMETRY_FLAKY_MIN_SAMPLES: ${FLAKEMETRY_FLAKY_MIN_SAMPLES:-}
      FLAKEMETRY_QUARANTINE_ENABLED: ${FLAKEMETRY_QUARANTINE_ENABLED:-}
      FLAKEMETRY_QUARANTINE_COOLDOWN_RUNS: ${FLAKEMETRY_QUARANTINE_COOLDOWN_RUNS:-}
      FLAKEMETRY_AI_RCA: ${FLAKEMETRY_AI_RCA:-}
      FLAKEMETRY_AI_DAILY_TOKEN_BUDGET: ${FLAKEMETRY_AI_DAILY_TOKEN_BUDGET:-}
      FLAKEMETRY_CI_MINUTE_COST: ${FLAKEMETRY_CI_MINUTE_COST:-}
      FLAKEMETRY_DEVELOPER_HOUR_COST: ${FLAKEMETRY_DEVELOPER_HOUR_COST:-}
      FLAKEMETRY_INVESTIGATION_MINUTES: ${FLAKEMETRY_INVESTIGATION_MINUTES:-}
      FLAKEMETRY_TRACKER_TOKEN: ${FLAKEMETRY_TRACKER_TOKEN:-}
      FLAKEMETRY_TRACKER_ENABLED: ${FLAKEMETRY_TRACKER_ENABLED:-}
      FLAKEMETRY_TRACKER_AFTER_DAYS: ${FLAKEMETRY_TRACKER_AFTER_DAYS:-}
      FLAKEMETRY_TRACKER_RECOVERY_DAYS: ${FLAKEMETRY_TRACKER_RECOVERY_DAYS:-}
      FLAKEMETRY_STORAGE_MAX_EXECUTIONS: ${FLAKEMETRY_STORAGE_MAX_EXECUTIONS:-}
      FLAKEMETRY_STORAGE_MAX_ARTIFACT_MB: ${FLAKEMETRY_STORAGE_MAX_ARTIFACT_MB:-}
      FLAKEMETRY_PUBLIC_API_URL: ${FLAKEMETRY_PUBLIC_API_URL:-http://localhost:4000}
      FLAKEMETRY_S3_BUCKET: ${S3_BUCKET:-flakemetry-artifacts}
      FLAKEMETRY_S3_ENDPOINT: ${FLAKEMETRY_S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      FLAKEMETRY_S3_REGION: ${FLAKEMETRY_S3_REGION:-us-east-1}
      FLAKEMETRY_S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-flakemetry}
      FLAKEMETRY_S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-flakemetry123}
      FLAKEMETRY_S3_FORCE_PATH_STYLE: 'true'
    ports:
      - '${BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-3000}:3000'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/health']
      interval: 10s
      timeout: 3s
      retries: 6

  otel-collector:
    profiles: [observability]
    image: otel/opentelemetry-collector-contrib:0.161.0
    command: ['--config=/etc/otelcol/config.yaml']
    volumes:
      - ./deploy/observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - '${BIND_ADDRESS:-127.0.0.1}:${OTLP_HTTP_PORT:-4318}:4318'
    depends_on:
      - prometheus

  prometheus:
    profiles: [observability]
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-otlp-receiver
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/observability/rules:/etc/prometheus/rules:ro
      - prometheusdata:/prometheus
    ports:
      - '${BIND_ADDRESS:-127.0.0.1}:${PROMETHEUS_PORT:-9090}:9090'

  grafana:
    profiles: [observability]
    image: grafana/grafana:13.2.3
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - '${BIND_ADDRESS:-127.0.0.1}:${GRAFANA_PORT:-3001}:3000'
    depends_on:
      - prometheus

volumes:
  pgdata:
  miniodata:
  prometheusdata:
  grafanadata:
