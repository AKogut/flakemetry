apiVersion: v1
kind: Service
metadata:
  name: {{ include "flakemetry.fullname" . }}-api
  labels:
    {{- include "flakemetry.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.api.service.type }}
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
  selector:
    {{- include "flakemetry.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
