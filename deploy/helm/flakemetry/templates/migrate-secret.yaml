{{- if and .Values.migrate.enabled (not .Values.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "flakemetry.fullname" . }}-migrate
  labels:
    {{- include "flakemetry.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: '-10'
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
type: Opaque
stringData:
  database-url: {{ required "database.url is required (or set existingSecret)" .Values.database.url | quote }}
{{- end }}
