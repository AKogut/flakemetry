{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "flakemetry.secretName" . }}
  labels:
    {{- include "flakemetry.labels" . | nindent 4 }}
type: Opaque
stringData:
  database-url: {{ required "database.url is required (or set existingSecret)" .Values.database.url | quote }}
  s3-access-key-id: {{ .Values.storage.accessKeyId | quote }}
  s3-secret-access-key: {{ .Values.storage.secretAccessKey | quote }}
  auth-secret: {{ required "auth.secret is required (or set existingSecret)" .Values.auth.secret | quote }}
  auth-github-id: {{ .Values.auth.githubId | quote }}
  auth-github-secret: {{ .Values.auth.githubSecret | quote }}
  ai-api-key: {{ .Values.ai.apiKey | quote }}
{{- end }}
